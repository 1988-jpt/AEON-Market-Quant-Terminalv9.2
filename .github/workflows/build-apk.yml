name: AEON V9.2.0 Android Production APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "**/*.py"
      - "**/*.kv"
      - "**/*.json"
      - "**/*.png"
      - "**/*.jpg"
      - "**/*.jpeg"
      - "**/*.ttf"
      - "buildozer.spec"
      - "requirements-android.txt"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

concurrency:
  group: aeon-android-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.10"
  JAVA_VERSION: "17"

jobs:
  build:

    runs-on: ubuntu-24.04

    timeout-minutes: 90

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: ${{ env.JAVA_VERSION }}

    - name: Cache Buildozer
      uses: actions/cache@v4
      with:
        path: |
          .buildozer
          ~/.buildozer
          ~/.gradle
        key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          buildozer-${{ runner.os }}

    - name: Install dependencies
      run: |
        sudo apt-get update

        sudo apt-get install -y \
          zip \
          unzip \
          git \
          build-essential \
          autoconf \
          automake \
          libtool \
          pkg-config \
          zlib1g-dev \
          libncurses5-dev \
          libncursesw5-dev \
          libtinfo6 \
          cmake \
          ninja-build \
          libffi-dev \
          libssl-dev

        python -m pip install --upgrade pip wheel setuptools

        pip install \
          cython==0.29.36 \
          buildozer==1.5.0

    - name: Validate project
      run: |

        test -f main.py

        test -f buildozer.spec

        python -m py_compile main.py

    - name: Clean previous build
      run: |

        rm -rf .buildozer

        rm -rf bin

    - name: Build APK
      run: |

        buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: AEON-V9.2.0-APK
        path: |
          bin/*.apk

    - name: Upload Build Logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Build-Logs
        path: |
          .buildozer/**/*.log
          .buildozer/logs/**
